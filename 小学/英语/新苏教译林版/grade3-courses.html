const courses=JSON.parse(document.getElementById('course-data').textContent);
const state={semester:1,id:null,activity:'focus',exercise:0,showChinese:true};
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const selected=()=>courses.find(c=>c.id===state.id);
const items=c=>c.sentence.sections.flatMap(section=>section.sentences.map(item=>({...item,section:section.title})));
const list=values=>'<ul>'+values.map(value=>'<li>'+esc(value)+'</li>').join('')+'</ul>';
const totalLines=courses.reduce((n,c)=>n+c.conversation.sections.reduce((s,section)=>s+section.lines.length,0),0);
document.getElementById('totals').textContent=`${courses.length}个课程 · ${totalLines}条原创配套对白 · 拆句 / 对话 / 句型迁移。教材原课文请查看各课官方来源链接。`;
function renderCourses(){
 const visible=courses.filter(c=>c.semester===state.semester);
 if(!visible.some(c=>c.id===state.id))state.id=visible[0].id;
 document.querySelectorAll('[data-semester]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.semester)===state.semester)));
 document.getElementById('course-list').innerHTML=visible.map(c=>`<button class="course-button" data-course="${esc(c.id)}" aria-pressed="${c.id===state.id}"><small>${c.kind==='unit'?'Unit':'Project'} ${c.number}</small>${esc(c.title)}</button>`).join('');
 document.querySelectorAll('[data-course]').forEach(b=>b.addEventListener('click',()=>{state.id=b.dataset.course;state.exercise=0;renderCourses();renderLesson()}));
}
function renderLesson(){
 const c=selected();
 document.getElementById('lesson').innerHTML=`<h2>${c.kind==='unit'?'Unit':'Project'} ${c.number} · ${esc(c.title)}</h2><div class="meta"><span class="tag">${esc(c.theme)}</span><span class="muted">教材第${c.pages.join('—')}页</span><a href="${esc(c.book.sourceUrl)}" target="_blank" rel="noopener noreferrer">查看官方教材</a><a href="${esc(c.directory)}/textbook.md">课程源文件</a></div><nav class="activity-tabs" aria-label="学习活动">${[['focus','学习重点'],['sentence','拆句练习'],['conversation','对话练习'],['patterns','句型迁移']].map(([key,label])=>`<button data-activity="${key}" aria-pressed="${key===state.activity}">${label}</button>`).join('')}</nav><section id="activity"></section><p class="notice">课程对白和练习为依据教材重点编写的原创配套内容。文字预览提供学习与自测；本页不含插画配音读本。</p>`;
 document.querySelectorAll('[data-activity]').forEach(b=>b.addEventListener('click',()=>{state.activity=b.dataset.activity;renderLesson()}));
 renderActivity();
}
function renderActivity(){
 const c=selected(),target=document.getElementById('activity');
 if(state.activity==='focus'){
  const core=c.vocabulary.filter(w=>w.kind==='core'),support=c.vocabulary.filter(w=>w.kind!=='core');
  const words=values=>`<div class="word-grid">${values.map(w=>`<div class="word"><div class="english">${esc(w.text)}</div><div class="phonetic">${esc(w.phonetic)} · ${esc(w.partOfSpeech)}</div><div>${esc(w.meaning)}</div></div>`).join('')}</div>`;
  target.innerHTML=`<h3>本课学会什么</h3>${list(c.objectives)}${c.focus.map(f=>`<div class="focus"><strong>${esc(f.title)}</strong>${esc(f.explanation)}</div>`).join('')}<div class="focus"><strong>${esc(c.phonics.title)}</strong>${esc(c.phonics.explanation)}</div><h3>${c.kind==='project'?'教材核心词复习':'本课教材核心词与表达'}</h3>${words(core)}<details><summary>前课复习与配套词汇</summary>${words(support)}</details><h3>动手与交流任务</h3><ol>${c.task.instructions.map(t=>'<li>'+esc(t)+'</li>').join('')}</ol><details><summary>我做到了吗？</summary>${list(c.task.successCriteria)}</details>`;
 }else if(state.activity==='conversation'){
  target.innerHTML=`<p class="muted">与同伴分角色练习下面的原创对白，再换成自己的信息。</p><button id="toggle-chinese" aria-pressed="${state.showChinese}">${state.showChinese?'隐藏中文':'显示中文'}</button>${c.conversation.sections.map(s=>`<h3 style="margin-top:20px">${esc(s.title)}</h3>${s.lines.map(l=>`<div class="dialogue-line"><div class="speaker">${l.sequenceNumber}. ${esc(l.speaker)}</div><div class="english">${esc(l.english)}</div><div class="chinese" ${state.showChinese?'':'hidden'}>${esc(l.chinese)}</div></div>`).join('')}`).join('')}`;
  document.getElementById('toggle-chinese').onclick=()=>{state.showChinese=!state.showChinese;renderActivity()};
 }else if(state.activity==='sentence'){
  const all=items(c);state.exercise=Math.max(0,Math.min(state.exercise,all.length-1));const item=all[state.exercise];
  const labels={word:'必记单词',phrase:'自然词组',sentence:'完整句'};
  target.innerHTML=`<p class="muted">逐组练“该词组的必记单词 → 该词组”，循环后练完整句；人名不单独出题，短句不强拆。</p><div class="controls"><button id="previous" ${state.exercise===0?'disabled':''}>上一题</button><span>${state.exercise+1} / ${all.length}</span><button id="next" ${state.exercise===all.length-1?'disabled':''}>下一题</button><label>跳到 <select id="exercise-select" aria-label="选择题目">${all.map((v,i)=>`<option value="${i}" ${i===state.exercise?'selected':''}>${i+1}. ${labels[v.category]} · 第${v.sequenceNumber}句</option>`).join('')}</select></label></div><div class="practice-card"><span class="tag">${labels[item.category]}</span><p>${esc(item.chinese)}</p><p class="muted">${esc(item.hint)}</p><button id="show-answer" aria-expanded="false">显示英文与解析</button><div id="practice-answer" class="practice-answer" hidden><div class="english">${esc(item.english)}</div><p>${esc(item.grammarAnalysis)}</p><p class="muted">${item.words.map(w=>`${esc(w.text)} ${esc(w.phonetic)}：${esc(w.meaning)}`).join('；')}</p></div></div>`;
  document.getElementById('previous').onclick=()=>{state.exercise--;renderActivity()};document.getElementById('next').onclick=()=>{state.exercise++;renderActivity()};
  document.getElementById('exercise-select').onchange=e=>{state.exercise=Number(e.target.value);renderActivity()};
  document.getElementById('show-answer').onclick=e=>{const panel=document.getElementById('practice-answer');panel.hidden=!panel.hidden;e.target.setAttribute('aria-expanded',String(!panel.hidden));e.target.textContent=panel.hidden?'显示英文与解析':'隐藏英文与解析'};
 }else{
  target.innerHTML=`<p class="muted">先读源句，再根据提示换人物、物品或场景。</p>${c.growth.patterns.map((p,i)=>`<div class="focus"><strong>${esc(p.displayName)}</strong><div class="english">${esc(p.examples[0])}</div><p>${esc(c.growth.transferPrompts[i].prompt)}</p><details><summary>查看参考答案</summary><div class="english">${esc(c.growth.transferPrompts[i].answer)}</div><p class="chinese">${esc(p.transferExampleDetails?.[0]?.chinese??'')}</p></details></div>`).join('')}`;
 }
}
document.querySelectorAll('[data-semester]').forEach(b=>b.onclick=()=>{state.semester=Number(b.dataset.semester);state.exercise=0;renderCourses();renderLesson()});
renderCourses();renderLesson();
</script></body></html>
